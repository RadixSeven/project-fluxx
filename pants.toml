[GLOBAL]
pants_version = "2.30.0"
backend_packages = [
    "pants.backend.python",
]
# Un-ignore the .claude directory (hidden dirs are often ignored by default)
pants_ignore = ["!/.claude"]

[source]
root_patterns = ["/src", "/tests", "/stubs", "/.claude"]

[python-bootstrap]
# Use Python from the project venv
search_path = ["%(buildroot)s/venv/bin", "<PATH>"]

[python]
interpreter_constraints = ["CPython>=3.13,<3.14"]
enable_resolves = true
default_resolve = "default"
# Lockfile was manually generated with pex3 for Linux-only
# See README or CLAUDE.md for regeneration command
resolves_generate_lockfiles = false

[python.resolves]
default = "locks/default.lock"

[pytest]
args = ["--no-header", "-vv"]

[test]
extra_env_vars = ["QT_QPA_PLATFORM=offscreen"]

[coverage-py]
report = ["json"]
# Only measure coverage for `src/fluxx` , not tests/
filter = ["fluxx"]
# Uncomment to measure coverage for src/fluxx and .claude/hooks
#  filter = ["fluxx" , ".claude/hooks"]
