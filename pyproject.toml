[project]
name = "project-fluxx"
version = "0.1.0"
description = "Project planning that incorporates uncertainty"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.7.0",
    "matplotlib>=3.10.8",
    "networkx>=3.0.0",
    "numpy>=1.26.0",
    "PySide6>=6.6.0",
    "pydantic>=2.0.0",
    "pyomo>=6.7.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
    "PySide6-stubs>=6.0",
    "types-networkx>=3.0",
    "types-requests>=2.28.0",
]

[project.scripts]
fluxx = "fluxx.__main__:main"
fluxx-remove-history = "fluxx.remove_history:main"
jql = "fluxx.jql:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = ["pydantic.mypy"]
mypy_path = "src:stubs"
namespace_packages = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
omit = [
    "*/__init__.py",
]
